name: Build Raphael Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi zip

      - name: Configure and Compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # These flags prevent the build from stopping on the tfa98xx audio error
          export KCFLAGS="-Wno-error=enum-int-mismatch -Wno-error=array-compare -Wno-error=address -Wno-error=dangling-pointer"

          # 1. Generate Config
          make raphael_defconfig
          
          # 2. Sync manual module edits
          make olddefconfig
          
          # 3. Compile Kernel and Modules
          make -j$(nproc --all) Image.gz-dtb modules

      - name: Package Kernel and Modules
        run: |
          mkdir -p output/modules
          
          # Copy the main Kernel Image
          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp arch/arm64/boot/Image.gz-dtb output/
          fi
          
          # Collect all compiled modules (.ko files) for your 5 features
          find . -name "*.ko" -exec cp {} output/modules/ \;
          
          # Zip modules only if they exist
          if [ "$(ls -A output/modules)" ]; then
            cd output && zip -r modules.zip modules/ && rm -rf modules/
          fi

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: Raphael-Kernel-Built
          path: output/*
