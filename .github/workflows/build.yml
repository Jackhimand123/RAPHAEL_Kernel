name: Build Raphael Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi zip

      - name: Configure and Compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # 1. Generate the base config for Mi9T Pro
          make raphael_defconfig
          
          # 2. Apply your manual module changes
          make olddefconfig
          
          # 3. Compile Kernel and Modules
          # This builds the Image and all the .ko files for your 5 modules
          make -j$(nproc --all) Image.gz-dtb modules

      - name: Package Kernel and Modules
        run: |
          mkdir -p output/modules
          
          # Copy the main Kernel Image
          cp arch/arm64/boot/Image.gz-dtb output/
          
          # Collect and zip all compiled modules (.ko files)
          # This is necessary for your 5 manual codes to actually work on the phone
          find . -name "*.ko" -exec cp {} output/modules/ \;
          cd output && zip -r modules.zip modules/ && rm -rf modules/

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: Raphael-Kernel-With-Modules
          path: output/*
