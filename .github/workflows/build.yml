name: Build Raphael Hack Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          # Changed 'dtc' to 'device-tree-compiler' and removed 'python2' which caused the crash
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 device-tree-compiler

      - name: Configure and Compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Essential for scripts that still look for 'python'
          sudo ln -sf /usr/bin/python3 /usr/bin/python

          # 1. Start with your raphael_defconfig
          make raphael_defconfig
          
          # 2. Inject Hack Requirements into the config
          ./scripts/config --set-str CONFIG_LOCALVERSION "-IMMENSITY-X"
          ./scripts/config --enable CONFIG_KALLSYMS
          ./scripts/config --enable CONFIG_KALLSYMS_ALL
          ./scripts/config --enable CONFIG_MODULES
          ./scripts/config --enable CONFIG_MODULE_UNLOAD
          ./scripts/config --enable CONFIG_MODULE_FORCE_LOAD
          ./scripts/config --enable CONFIG_MODVERSIONS
          ./scripts/config --disable CONFIG_SECURITY_SELINUX
          ./scripts/config --disable CONFIG_SECURITY_NETWORK
          
          # 3. Apply changes
          make olddefconfig
          
          # 4. Build Kernel + DTB (Raphael needs both for a proper boot)
          # Building Image.gz specifically for Raphael
          make -j$(nproc --all) Image.gz dtbs modules

      - name: Organize Artifacts
        if: always() 
        run: |
          mkdir -p out/dtb
          mkdir -p out/modules
          
          # Copy the compressed kernel image (Expected by most Raphael installers)
          if [ -f arch/arm64/boot/Image.gz ]; then
            cp arch/arm64/boot/Image.gz out/
          else
            cp arch/arm64/boot/Image out/
          fi
          
          # Collect DTBs (Essential for hardware compatibility like Touch/Camera)
          find arch/arm64/boot/dts/ -name "*.dtb" -exec cp {} out/dtb/ \;
          
          # Collect modules for your RT-hook script
          find . -name "*.ko" -exec cp {} out/modules/ \;

      - name: Upload Raphael Hack Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Raphael-Hack-Kernel-Output
          path: out/
