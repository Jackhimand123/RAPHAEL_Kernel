name: Build Gravity-perf Kernel (A15)
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev \
          ccache bison flex libelf-dev clang lld llvm

      - name: Setup Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 clang
          echo "$(pwd)/clang/bin" >> $GITHUB_PATH

      - name: Build Kernel
        run: |
          # Define Variables
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="Gravity"
          export KBUILD_BUILD_HOST="Perf-Lab"
          export PATH="$(pwd)/clang/bin:$PATH"
          
          # Use Clang & LLVM Tools
          MAKE_ARGS="CC=clang \
                     LD=ld.lld \
                     AR=llvm-ar \
                     NM=llvm-nm \
                     OBJCOPY=llvm-objcopy \
                     OBJDUMP=llvm-objdump \
                     STRIP=llvm-strip \
                     CROSS_COMPILE=aarch64-linux-gnu- \
                     CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                     LLVM=1"

          # 1. Regenerate Config
          make O=out $MAKE_ARGS raphael_defconfig

          # 2. Compile (uses all available CPU cores)
          make -j$(nproc --all) O=out $MAKE_ARGS
        
      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          # Simple zip packaging
          zip -r9 ../Gravity-perf-Raphael.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gravity-perf-Kernel
          path: Gravity-perf-Raphael.zip
