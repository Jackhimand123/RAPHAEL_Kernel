name: Build Raphael Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          # Install necessary tools for 2026 Ubuntu environment
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi zip python3 python-is-python3
          
          # Create the python2 alias needed by older kernel scripts
          sudo ln -sf /usr/bin/python3 /usr/bin/python2

      - name: Configure and Compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Flags to bypass warnings that older kernels treat as errors with newer compilers
          export KCFLAGS="-Wno-error=enum-int-mismatch -Wno-error=array-compare -Wno-error=address -Wno-error=dangling-pointer -Wno-error=stringop-overread -Wno-error=maybe-uninitialized"

          # Load the device configuration
          make raphael_defconfig
          
          # Ensure the broken trace driver is disabled (even though we deleted the files)
          scripts/config --disable CONFIG_HID_TRACE
          
          make olddefconfig
          
          # Build the kernel with integrated device tree and modules
          # (Note: 'dtbo' was removed from here because it caused the 'No rule to make target' error)
          make -j$(nproc --all) Image.gz-dtb modules

      - name: Package Modules
        run: |
          mkdir -p output/modules
          # Find all kernel modules (.ko files) and move them to a zip folder
          find . -name "*.ko" -exec cp {} output/modules/ \;
          if [ "$(ls -A output/modules)" ]; then
            cd output && zip -r modules.zip modules/ && rm -rf modules/
          fi

      - name: Upload Final Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Raphael-Kernel-Release
          path: |
            arch/arm64/boot/Image.gz-dtb
            output/modules.zip
