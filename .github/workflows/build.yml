name: Build Raphael Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu zip

      - name: Configure and Compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Standard kernel config commands
          make raphael_defconfig
          make olddefconfig
          
          # Build core kernel image
          make -j$(nproc --all) Image.gz-dtb

      - name: Prepare Artifacts
        run: |
          mkdir -p output
          cp arch/arm64/boot/Image.gz-dtb output/

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Result
          path: output/
