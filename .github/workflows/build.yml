name: Build Raphael Hack Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Configure and Compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Force python2 to 'true' to skip old script requirements
          sudo ln -sf /usr/bin/true /usr/bin/python2

          # Your shield against driver warnings
          export KCFLAGS="-Wno-error=enum-int-mismatch -Wno-error=array-compare -Wno-error=address -Wno-error=dangling-pointer -Wno-error=stringop-overread -Wno-error=maybe-uninitialized -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=return-type -Wno-error=implicit-int"

          make raphael_defconfig
          
          # DISABLE the specific bundling that caused the Exit Code 2
          scripts/config --disable CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE
          scripts/config --disable CONFIG_BUILD_ARM64_DTB_OVERLAY
          scripts/config --disable CONFIG_HID_TRACE
          
          make olddefconfig
          
          # Build ONLY the raw kernel 'Image' and modules.
          # This avoids the 'embedded-dtb' crash completely.
          make -j$(nproc --all) Image modules

      - name: Organize Artifacts
        run: |
          mkdir -p out/modules
          cp arch/arm64/boot/Image out/ || true
          find . -name "*.ko" -exec cp {} out/modules/ \;

      - name: Upload Hack Kernel Package
        uses: actions/upload-artifact@v4
        with:
          name: Raphael-Hack-Kernel
          path: out/
