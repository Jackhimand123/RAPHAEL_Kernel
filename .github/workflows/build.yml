name: Build Gravity-perf Kernel (A15)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev \
          ccache bison flex libelf-dev clang lld llvm

      - name: Setup Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 clang

      - name: Build Kernel
        run: |
          # Absolute path to Clang
          CLANG_DIR=$(pwd)/clang/bin
          export PATH="$CLANG_DIR:$PATH"
          
          # ARCH and User info
          export ARCH=arm64
          export KBUILD_BUILD_USER="Gravity"
          export KBUILD_BUILD_HOST="Perf-Lab"
          
          # Correcting the Arguments to fix the Linker Error
          # We use system 'gcc' for HOSTCC to avoid the libc incompatibility
          MAKE_ARGS="CC=clang \
                     HOSTCC=gcc \
                     HOSTCXX=g++ \
                     LD=ld.lld \
                     AR=llvm-ar \
                     NM=llvm-nm \
                     OBJCOPY=llvm-objcopy \
                     OBJDUMP=llvm-objdump \
                     STRIP=llvm-strip \
                     CROSS_COMPILE=aarch64-linux-gnu- \
                     CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
                     LLVM=1"

          # Create output directory
          mkdir -out

          # 1. Configuration
          make O=out $MAKE_ARGS raphael_defconfig

          # 2. Build Image.gz-dtb
          make -j$(nproc --all) O=out $MAKE_ARGS Image.gz-dtb

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3
          # Raphael usually uses Image.gz-dtb
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          else
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          fi
          cd AnyKernel3
          zip -r9 ../Gravity-perf-Raphael.zip * -x .git README.md

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Gravity-perf-Kernel
          path: Gravity-perf-Raphael.zip
