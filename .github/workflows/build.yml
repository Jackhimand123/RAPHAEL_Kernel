name: Build Raphael Hack Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3

      - name: Configure and Compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Safety for older Python scripts
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          sudo ln -sf /usr/bin/true /usr/bin/python2

          # FLAGS FOR GAME HACKS: Ensure symbols and modules are visible
          export KCFLAGS="-Wno-error=enum-int-mismatch -Wno-error=address -Wno-error=int-conversion -Wno-error=implicit-function-declaration"

          make raphael_defconfig
          
          # Enable Hack-Specific Support
          scripts/config --enable CONFIG_KALLSYMS
          scripts/config --enable CONFIG_KALLSYMS_ALL
          scripts/config --enable CONFIG_MODULES
          
          # Disable the features that trigger the broken Makefile blocks
          scripts/config --disable CONFIG_BUILD_ARM64_EMBEDDED_DTB
          scripts/config --disable CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE
          scripts/config --disable CONFIG_BUILD_ARM64_DT_OVERLAY
          
          make olddefconfig
          
          # Build the raw Image. The '|| true' ensures we proceed to upload even if a script fails at 99%
          make -j$(nproc --all) Image modules || true

      - name: Organize Artifacts
        if: always() 
        run: |
          mkdir -p out/modules
          # Hunt for the kernel binary (Image is the goal, vmlinux is the backup)
          [ -f arch/arm64/boot/Image ] && cp arch/arm64/boot/Image out/ || cp vmlinux out/ || echo "Kernel not found"
          find . -name "*.ko" -exec cp {} out/modules/ \;

      - name: Upload Hack Kernel Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Raphael-Hack-Kernel
          path: out/
