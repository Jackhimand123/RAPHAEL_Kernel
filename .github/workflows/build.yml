name: Build Raphael Hack Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 python2 dtc

      - name: Configure and Compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Fix for older scripts expecting 'python'
          sudo ln -sf /usr/bin/python3 /usr/bin/python

          # 1. Load the base config
          make raphael_defconfig
          
          # 2. Apply Hack-Specific Configs via scripts/config
          ./scripts/config --set-str CONFIG_LOCALVERSION "-IMMENSITY-X"
          ./scripts/config --enable CONFIG_KALLSYMS
          ./scripts/config --enable CONFIG_KALLSYMS_ALL
          ./scripts/config --enable CONFIG_MODULES
          ./scripts/config --enable CONFIG_MODULE_UNLOAD
          ./scripts/config --enable CONFIG_MODULE_FORCE_LOAD
          ./scripts/config --enable CONFIG_MODVERSIONS
          
          # 3. Disable Security that blocks ioctl hooks
          ./scripts/config --disable CONFIG_SECURITY_SELINUX
          ./scripts/config --disable CONFIG_SECURITY_NETWORK

          # 4. Sync config
          make olddefconfig
          
          # 5. Build Image.gz and DTBs (Raphael needs both)
          # We don't use '|| true' here so we catch real errors
          make -j$(nproc --all) Image.gz dtbs modules

      - name: Organize Artifacts
        if: always() 
        run: |
          mkdir -p out/dtb
          mkdir -p out/modules
          
          # Copy Kernel Image
          [ -f arch/arm64/boot/Image.gz ] && cp arch/arm64/boot/Image.gz out/ || echo "Image.gz not found"
          
          # Find and copy all DTB files (Device Tree Blobs)
          find arch/arm64/boot/dts/ -name "*.dtb" -exec cp {} out/dtb/ \;
          
          # Find all compiled modules (.ko files)
          find . -name "*.ko" -exec cp {} out/modules/ \;

      - name: Upload Kernel Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Raphael-Hack-Package
          path: out/
