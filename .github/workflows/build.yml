name: Build Raphael Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu zip

      - name: Build Kernel
        run: |
          # Define variables for this specific step
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KCFLAGS="-w" # Ignore warnings to prevent unnecessary stops
          
          # 1. Sync your manual module edits
          make raphael_defconfig
          make olddefconfig
          
          # 2. Compile
          make -j$(nproc --all) Image.gz-dtb modules

      - name: Package & Upload
        run: |
          mkdir -p out_final
          cp arch/arm64/boot/Image.gz-dtb out_final/ || true
          
          # Install and zip modules if enabled
          if grep -q "CONFIG_MODULES=y" .config; then
            mkdir -p mod_temp
            make INSTALL_MOD_PATH=./mod_temp modules_install
            cd mod_temp && zip -r ../out_final/modules.zip . && cd ..
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Raphael-Kernel-Pack
          path: out_final/*
