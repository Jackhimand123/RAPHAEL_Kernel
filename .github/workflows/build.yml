name: Build Raphael Hack Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 device-tree-compiler

      - name: Configure and Compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Force the compiler to ignore enum mismatches globally
          export KCFLAGS="-Wno-error=enum-int-mismatch -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=unused-variable"
          
          sudo ln -sf /usr/bin/python3 /usr/bin/python

          # 1. Load config
          make raphael_defconfig
          
          # 2. DISABLE THE BROKEN AUDIO TECHPACK
          # This prevents the tfa98xx error from stopping your build
          ./scripts/config --disable CONFIG_SND_SOC_TFA98XX
          ./scripts/config --disable CONFIG_TECHPACK_AUDIO
          
          # 3. Disable Broken Embedded DTB logic
          ./scripts/config --disable CONFIG_BUILD_ARM64_EMBEDDED_DTB
          ./scripts/config --disable CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE
          ./scripts/config --disable CONFIG_BUILD_ARM64_DT_OVERLAY
          
          # 4. Apply Hack Requirements (Mandatory for 4.14.180.sh)
          ./scripts/config --set-str CONFIG_LOCALVERSION "-IMMENSITY-X"
          ./scripts/config --enable CONFIG_KALLSYMS
          ./scripts/config --enable CONFIG_KALLSYMS_ALL
          ./scripts/config --enable CONFIG_MODULES
          ./scripts/config --enable CONFIG_MODULE_UNLOAD
          ./scripts/config --enable CONFIG_MODULE_FORCE_LOAD
          ./scripts/config --enable CONFIG_MODVERSIONS
          ./scripts/config --disable CONFIG_SECURITY_SELINUX
          ./scripts/config --disable CONFIG_SECURITY_NETWORK
          
          # 5. Build
          make olddefconfig
          make -j$(nproc --all) Image dtbs modules

      - name: Organize Artifacts
        if: always() 
        run: |
          mkdir -p out/dtb
          mkdir -p out/modules
          if [ -f arch/arm64/boot/Image ]; then cp arch/arm64/boot/Image out/; fi
          find arch/arm64/boot/dts/ -name "*.dtb" -exec cp {} out/dtb/ \;
          find . -name "*.ko" -exec cp {} out/modules/ \;

      - name: Upload Raphael Hack Package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Raphael-Hack-Kernel
          path: out/
