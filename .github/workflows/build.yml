name: Build Raphael Hack Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 device-tree-compiler

      - name: Configure and Compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Fix for Audio/WLAN type mismatches
          export KCFLAGS="-Wno-error=enum-int-mismatch -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=unused-variable"
          
          sudo ln -sf /usr/bin/python3 /usr/bin/python

          make raphael_defconfig
          
          # --- THE FIXES ---
          # 1. Merge DTB into Kernel (Fixes 'Image only' issue)
          ./scripts/config --enable CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE
          
          # 2. Bypass broken modules
          ./scripts/config --disable CONFIG_SND_SOC_TFA98XX
          ./scripts/config --disable CONFIG_TECHPACK_AUDIO
          ./scripts/config --disable CONFIG_BUILD_ARM64_EMBEDDED_DTB
          
          # 3. Hack Hooks (For your 4.14.180.sh script)
          ./scripts/config --set-str CONFIG_LOCALVERSION "-IMMENSITY-X"
          ./scripts/config --enable CONFIG_KALLSYMS
          ./scripts/config --enable CONFIG_KALLSYMS_ALL
          ./scripts/config --enable CONFIG_MODULES
          ./scripts/config --enable CONFIG_MODVERSIONS
          ./scripts/config --disable CONFIG_SECURITY_SELINUX
          ./scripts/config --disable CONFIG_SECURITY_NETWORK
          
          make olddefconfig
          # Build the merged image and modules
          make -j$(nproc --all) Image.gz-dtb modules

      - name: Organize Artifacts
        if: always() 
        run: |
          mkdir -p out/modules
          
          # Identify the merged kernel file
          if [ -f arch/arm64/boot/Image.gz-dtb ]; then
            cp arch/arm64/boot/Image.gz-dtb out/Image.gz-dtb
          elif [ -f arch/arm64/boot/Image.gz ]; then
            cp arch/arm64/boot/Image.gz out/Image.gz
          else
            cp arch/arm64/boot/Image out/Image
          fi
          
          # Copy modules but skip the output folder to avoid 'same file' error
          find . -name "*.ko" -not -path "./out/*" -exec cp {} out/modules/ \;

      - name: Upload Flashable Kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Raphael-Hack-Kernel-Final
          path: out/
