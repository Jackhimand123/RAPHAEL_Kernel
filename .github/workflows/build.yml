name: Build Raphael Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          # Fixed: Install python2-minimal for the dtbo.img tool
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi zip python2-minimal
          # Fixed: Force link python3 to python2 just in case
          sudo ln -sf /usr/bin/python3 /usr/bin/python2

      - name: Configure and Compile
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Fixed: Bypass the 'Wstringop-overread' and Audio driver warnings
          export KCFLAGS="-Wno-error=enum-int-mismatch -Wno-error=array-compare -Wno-error=address -Wno-error=dangling-pointer -Wno-error=stringop-overread -Wno-error=maybe-uninitialized"

          # Load your specific device config
          make raphael_defconfig
          
          # Ensure HID_TRACE is off in the config since we deleted the files
          scripts/config --disable CONFIG_HID_TRACE
          
          make olddefconfig
          
          # Fixed: Build Kernel, DTBO, and Modules
          make -j$(nproc --all) Image.gz-dtb dtbo modules

      - name: Package Modules
        run: |
          mkdir -p output/modules
          # Find all compiled modules and zip them
          find . -name "*.ko" -exec cp {} output/modules/ \;
          if [ "$(ls -A output/modules)" ]; then
            cd output && zip -r modules.zip modules/ && rm -rf modules/
          fi

      - name: Upload Final Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Raphael-Kernel-Release
          path: |
            arch/arm64/boot/Image.gz-dtb
            arch/arm64/boot/dtbo.img
            output/modules.zip
